<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>创建奖品</title>

    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/base.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: white;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 800px;
            margin: 10px auto;
            padding: 20px;
            background-color: #fff;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
        }

        .form-group input[type=text],
        .form-group input[type=url],
        .form-group input[type=number] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .form-group textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .btn {
            border: none;
            border-radius: 6px;
            cursor: pointer;
            width: 140px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
        }

        .prize-row {
            margin-bottom: 10px;
        }

        .container h2 {
            font-weight: 600;
            font-size: 30px;
            letter-spacing: 1px;
            color: #000000;
            line-height: 50px;
            text-align: center;
            margin-bottom: 40px;
        }

        .upload-box {
            display: flex;
            width: 150px;
            height: 150px;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 1px dashed #4c8dfb;
            background-color: #EDF3FE;
            cursor: pointer;
            margin-bottom: 10px;
            position: relative;
            border-radius: 8px;
            overflow: hidden;
        }

        .plus {
            color: #4C8DFB;
            font-size: 30px;
        }

        .up-txt {
            font-weight: 400;
            font-size: 14px;
            color: #4C8DFB;
        }

        .upload-box .form-control {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 100%;
            opacity: 0;
            z-index: 2;
        }

        .preview-img {
            width: 150px;
            height: 150px;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            display: none;
            background-color: #fff;
            object-fit: scale-down;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>开始创建奖品</h2>

    <div id="prizeRows">

        <div class="prize-row">

            <div class="form-group">
                <label for="prizeName">奖品名称</label>
                <input
                        class="form-control"
                        type="text"
                        placeholder="请输入奖品名称"
                        id="prizeName"
                        required
                >
            </div>

            <div class="form-group">
                <label>奖品图片</label>

                <div class="img-upload">

                    <div class="upload-box">

                        <span class="plus">+</span>
                        <span class="up-txt">上传图片</span>

                        <img
                                src="./pic/bg.png"
                                class="preview-img"
                                id="previewImg"
                                alt=""
                        >

                        <input
                                class="form-control"
                                type="file"
                                id="prizeImageUrl"
                                onchange="showImg()"
                        >

                    </div>

                </div>
            </div>

            <div class="form-group">
                <label for="price">奖品价格</label>
                <input
                        class="form-control"
                        placeholder="请输入奖品价格"
                        type="number"
                        id="price"
                        required
                >
            </div>

            <div class="form-group">
                <label for="description">奖品描述</label>

                <textarea
                        class="form-control"
                        id="description"
                        placeholder="请输入奖品描述"
                        required
                ></textarea>
            </div>

        </div>

    </div>

    <button
            type="button"
            class="btn btn-primary"
            onclick="submitPrizes()"
    >
        创建奖品
    </button>

</div>

<script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.6.0/jquery.min.js"></script>

<script>

    var userToken = localStorage.getItem("user_token");

    // 图片预览
    function showImg() {

        var file = document.getElementById("prizeImageUrl").files[0];

        if (!file) {
            return;
        }

        var r = new FileReader();

        r.readAsDataURL(file);

        r.onload = function (e) {

            $('#previewImg')
                .attr("src", e.target.result)
                .show();
        }
    }

    // 提交奖品
    function submitPrizes() {

        var prizeName = $('#prizeName').val();
        var description = $('#description').val();
        var price = $('#price').val();

        var file = document.getElementById("prizeImageUrl").files[0];

        if (!file) {
            alert("请上传奖品图片！");
            return;
        }

        // 重点：FormData 必须在这里创建
        var formData = new FormData();

        // param 名必须和后端 @RequestPart("param") 一致
        formData.append(
            "param",
            new Blob(
                [JSON.stringify({
                    prizeName: prizeName,
                    description: description,
                    price: price
                })],
                {
                    type: "application/json"
                }
            )
        );

        // prizePic 名必须和后端 @RequestPart("prizePic") 一致
        formData.append("prizePic", file);

        $.ajax({

            url: '/prize/create',

            type: 'POST',

            data: formData,

            processData: false,

            contentType: false,

            headers: {
                "user_token": userToken
            },

            success: function (result) {

                console.log(result);

                if (result.code == 200) {

                    alert('奖品创建成功！');

                } else {

                    alert('创建奖品失败：' + result.msg);
                }
            },

            error: function (err) {

                console.log(err);

                if (err != null && err.status == 401) {

                    alert("用户未登录，即将跳转到登录页!");

                    window.location.href = "/blogin.html";

                    window.parent.location.href = "/blogin.html";

                } else {

                    alert("创建失败！");
                }
            }

        });

    }

</script>

</body>
</html>
